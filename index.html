  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #FAFAF8; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #F2F0EC; }
    ::-webkit-scrollbar-thumb { background: #E8B84B; border-radius: 3px; }
    button, input, textarea, select { font-family: 'Inter', sans-serif; }
    a { font-family: 'Inter', sans-serif; }

    /* ── Responsive overrides (mobile) ───────────────────────────────── */
    @media (max-width: 860px) {
      .cdl-grid-2, .cdl-grid-3 { grid-template-columns: 1fr !important; }
      .cdl-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
      .cdl-section-pad { padding: 40px 24px !important; }
      .cdl-section-pad-lg { padding: 48px 24px !important; }
      .cdl-hero-text { padding: 48px 24px !important; border-right: none !important; }
      .cdl-border-r { border-right: none !important; }
      .cdl-border-l { border-left: none !important; }
      .cdl-border-b-mobile { border-bottom: 1px solid #E6E4E0 !important; }
      .cdl-h1 { font-size: clamp(32px, 8vw, 44px) !important; }
      .cdl-h2 { font-size: clamp(26px, 6vw, 34px) !important; }
      .cdl-stack-mobile { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
      .cdl-order-first-mobile { order: 1 !important; }
      .cdl-order-last-mobile { order: 2 !important; }
      .cdl-item-pad { padding: 28px 24px !important; }
      .cdl-nav-links { display: none !important; }
      .cdl-nav-toggle { display: flex !important; }
      .cdl-mobile-menu { display: flex !important; }
      .cdl-container { padding-left: 20px !important; padding-right: 20px !important; }
    }
    @media (min-width: 861px) {
      .cdl-nav-toggle { display: none !important; }
      .cdl-mobile-menu { display: none !important; }
    }
  </style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#F5F4F1">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <!-- Logo mark: cat on moon -->
      <circle cx="600" cy="340" r="120" fill="#E8B84B" opacity="0.9"/>
      <circle cx="640" cy="310" r="90" fill="#F5F4F1"/>
      <!-- Cat face -->
      <ellipse cx="600" cy="355" rx="55" ry="50" fill="#0D0D0D"/>
      <circle cx="583" cy="345" r="7" fill="#F5F4F1"/>
      <circle cx="617" cy="345" r="7" fill="#F5F4F1"/>
      <ellipse cx="600" cy="365" rx="10" ry="7" fill="#F5F4F1"/>
      <!-- Cat ears -->
      <polygon points="558,318 545,295 572,305" fill="#0D0D0D"/>
      <polygon points="642,318 655,295 628,305" fill="#0D0D0D"/>
      <!-- Wordmark -->
      <text x="600" y="510" fontFamily="serif" fontSize="38" fontWeight="700" fill="#0D0D0D" textAnchor="middle" letterSpacing="4">CALLE DE LUNA</text>
      <text x="600" y="548" fontFamily="serif" fontSize="20" fill="#C4954A" textAnchor="middle" letterSpacing="6">RESCUE</text>
    </svg>
  </template>
  <div id="root"></div>

  <script>
    window.CATS = [
      { id:1, name:'Ghost', age:'12 years', gender:'Female', color:'Gray tabby', status:'Available', img:'uploads/ghost.jpg', gallery:['uploads/ghost2.jpg'],
        teaser:'A tiny, glamorous neighborhood legend looking for a quiet home of her own.',
        desc:"Ghost is a neighborhood celebrity — for years, volunteers and neighbors have stopped by daily just to see her. Tiny and glamorous, she used to live at a warehouse that has since been torn down, then made her home on the street. Somehow her soft grey coat has always stayed impossibly clean.\n\nAt just 5.2 pounds, Ghost is petite but mighty, with a meow like a panther. She wants constant pampering, does best without other cats or pets, and needs a home with cat-experienced adults. She'll nuzzle you, let you carry her around, and is even fine in the car — as long as she can watch the world go by." },
      { id:2, name:'Blackie', age:'3–4 months', gender:'Female', color:'Black', status:'Available', img:'uploads/blackie.jpg',
        teaser:'A playful kitten in training, almost ready for a family of her own.',
        desc:"Blackie was TNR'd in our community as a young kitten and has been living with our founder ever since, learning to trust people and grow into a confident, socialized cat. At 3–4 months old, she's playful, affectionate, and getting ready to find a family of her own." },
      { id:3, name:'Buckwheat', gender:'Male', color:'Gray tabby & white', status:'Adopted', img:'uploads/buckwheat.jpg', gallery:['uploads/buckwheat2.jpg'],
        teaser:'A sweet, easygoing community cat ready to find a home of his own.',
        desc:"Buckwheat is a friendly community cat looking for his forever home. More of his story is coming soon — check back or reach out to us directly to learn more about him." },
      { id:4, name:'Daisy', gender:'Female', age:'4 months', color:'Black', status:'Adopted', img:'uploads/daisy.jpg',
        caption:'Adopted in July.' },
      { id:5, name:'Emilia', gender:'Female', age:'3 months', color:'Black', status:'Adopted', img:'uploads/emilia.jpg',
        caption:'Adopted in August.' },
    ];
    window.STATIONS = [
      { id:'A', label:'Station A – Near School Gate' },
      { id:'B', label:'Station B – Park Entrance' },
      { id:'C', label:'Station C – Market Alley' },
      { id:'D', label:'Station D – Community Garden' },
      { id:'E', label:'Station E – Back Lane' },
    ];
  </script>

  <script type="text/babel" src="public-site-v2.jsx?v=20260824r"></script>
  <script type="text/babel" src="internal-tool-supabase.jsx?v=20260824r"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "goldAccent": "#E8B84B",
      "darkBg": "#0F0F0E"
    }/*EDITMODE-END*/;

    function App() {
      const [section, setSection] = useState('public');
      const [page,    setPage]    = useState('home');
      const [user,    setUser]    = useState(null);
      const [tweaksOpen, setTweaksOpen] = useState(false);

      useEffect(() => {
        window.addEventListener('message', (e) => {
          if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
        });
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      }, []);

      const [selectedCatId, setSelectedCatId] = useState(null);

      useEffect(() => {
        history.replaceState({ page:'home', section:'public' }, '', '#home');
        const onPopState = (e) => {
          const s = e.state || { page:'home', section:'public' };
          setSection(s.section || 'public');
          setPage(s.page || 'home');
          if (s.catId != null) setSelectedCatId(s.catId);
          window.scrollTo(0,0);
        };
        window.addEventListener('popstate', onPopState);
        return () => window.removeEventListener('popstate', onPopState);
      }, []);

      const goPage = (p) => { setPage(p); setSection('public'); window.scrollTo(0,0); history.pushState({ page:p, section:'public' }, '', '#'+p); };
      window.__setPage = goPage;
      const goCat = (id) => { setSelectedCatId(id); setPage('cat-detail'); setSection('public'); window.scrollTo(0,0); history.pushState({ page:'cat-detail', section:'public', catId:id }, '', '#cat-'+id); };
      window.__goCat = goCat;
      const goPortal = () => { setSection('portal'); setUser(null); history.pushState({ page:'home', section:'portal' }, '', '#portal'); };
      const handleLogin  = (u) => { setUser(u); };
      const handleLogout = ()  => { setUser(null); setSection('public'); setPage('home'); };

      return (
        <div>
          {/* Public site */}
          {section === 'public' && (
            <>
              <PublicNav page={page} setPage={goPage} onPortal={goPortal} />
              {page === 'home'      && <HomePage      setPage={goPage} />}
              {page === 'cats'      && <CatsPage      />}
              {page === 'cat-detail'&& <CatDetailPage catId={selectedCatId} setPage={goPage} />}
              {page === 'volunteer' && <VolunteerPage />}
              {page === 'donate'    && <DonatePage />}
            </>
          )}

          {/* Portal – login */}
          {section === 'portal' && !user && (
            <div>
              <button onClick={()=>setSection('public')} style={{ position:'fixed', top:16, left:16, zIndex:50, padding:'7px 14px', background:'rgba(255,255,255,0.08)', border:'1px solid rgba(255,255,255,0.15)', borderRadius:6, fontSize:13, color:'rgba(255,255,255,0.7)', cursor:'pointer', fontFamily:"'Inter',sans-serif" }}>
                ← Back to site
              </button>
              <SBLogin onLogin={handleLogin} />
            </div>
          )}

          {/* Portal – volunteer */}
          {section === 'portal' && user?.role === 'volunteer' && (
            <SBFeedingLog user={user} />
          )}

          {/* Portal – admin */}
          {section === 'portal' && user?.role === 'admin' && (
            <SBAdminDashboard user={user} />
          )}

          {/* Tweaks panel */}
          {tweaksOpen && (
            <div style={{ position:'fixed', bottom:24, right:24, background:'#fff', border:'1px solid #E6E4E0', borderRadius:12, padding:'22px 24px', width:280, boxShadow:'0 12px 48px rgba(0,0,0,0.12)', zIndex:9999, fontFamily:"'Inter',sans-serif" }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
                <span style={{ fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:14, color:'#0F0F0E' }}>Tweaks</span>
                <button onClick={()=>{ setTweaksOpen(false); window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }} style={{ background:'none', border:'none', cursor:'pointer', fontSize:20, color:'#74726E', lineHeight:1, padding:0 }}>×</button>
              </div>

              <div style={{ marginBottom:18 }}>
                <div style={{ fontSize:11, fontWeight:700, color:'#74726E', textTransform:'uppercase', letterSpacing:1, marginBottom:10 }}>Navigate to</div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                  {['home','cats','volunteer','donate'].map(p => (
                    <button key={p} onClick={()=>goPage(p)} style={{ padding:'6px 12px', borderRadius:14, border:'1px solid #E6E4E0', background: page===p && section==='public' ? '#0F0F0E' : '#FAFAF8', color: page===p && section==='public' ? '#fff' : '#74726E', fontSize:12, cursor:'pointer', textTransform:'capitalize', fontFamily:"'Inter',sans-serif" }}>{p}</button>
                  ))}
                </div>
              </div>

              <div style={{ marginBottom:18 }}>
                <div style={{ fontSize:11, fontWeight:700, color:'#74726E', textTransform:'uppercase', letterSpacing:1, marginBottom:10 }}>Portal preview</div>
                <div style={{ display:'flex', gap:6 }}>
                  {[
                    { label:'Login',     action:()=>{ setSection('portal'); setUser(null); } },
                    { label:'Volunteer', action:()=>{ setSection('portal'); setUser({name:'Maria',role:'volunteer'}); } },
                    { label:'Admin',     action:()=>{ setSection('portal'); setUser({name:'Admin',role:'admin'}); } },
                  ].map(b => (
                    <button key={b.label} onClick={b.action} style={{ flex:1, padding:'7px 0', borderRadius:6, border:'1px solid #E6E4E0', background:'#FAFAF8', color:'#0F0F0E', fontSize:11, cursor:'pointer', fontWeight:600 }}>{b.label}</button>
                  ))}
                </div>
              </div>

              <div>
                <div style={{ fontSize:11, fontWeight:700, color:'#74726E', textTransform:'uppercase', letterSpacing:1, marginBottom:10 }}>Gold Accent</div>
                <div style={{ display:'flex', gap:8 }}>
                  {['#E8B84B','#D97B4A','#6AAF8B','#6A8FD4','#B07ACC'].map(c => (
                    <div key={c} onClick={()=>window.parent.postMessage({type:'__edit_mode_set_keys',edits:{goldAccent:c}},'*')} style={{ width:26, height:26, borderRadius:'50%', background:c, cursor:'pointer', border:'2.5px solid transparent', outline:'2px solid transparent' }}/>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
